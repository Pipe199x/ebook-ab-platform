name: Guardrail CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guardrail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Synthesize CDK
        run: npx cdk synth --json > cdk-output.json
      - name: Run guardrail (should pass)
        run: node scripts/guardrail.js
      - name: Create faulty stack with Glue Job
        run: |
          cat <<'EOF' > tmp_glue_stack.ts
          import * as cdk from 'aws-cdk-lib';
          import { Stack, StackProps } from 'aws-cdk-lib';
          import { aws_glue as glue } from 'aws-cdk-lib';
          class FaultyStack extends Stack {
            constructor(scope: cdk.App, id: string, props?: StackProps) {
              super(scope, id, props);
              new glue.CfnJob(this, 'BadGlueJob', {
                name: 'BadJob',
                role: 'arn:aws:iam::123456789012:role/GlueServiceRole',
                command: { name: 'glueetl', scriptLocation: 's3://my-bucket/script.py' }
              });
            }
          }
          const app = new cdk.App();
          new FaultyStack(app, 'FaultyStack');
          app.synth();
          EOF
      - name: Synthesize faulty stack
        run: npx ts-node tmp_glue_stack.ts > faulty-output.json
      - name: Run guardrail (should fail)
        run: |
          set -e
          node scripts/guardrail.js && echo "Guardrail did NOT fail on Glue job" && exit 1 || echo "Guardrail correctly failed"

      - name: Cleanup
        run: rm -f tmp_glue_stack.ts cdk-output.json faulty-output.json
