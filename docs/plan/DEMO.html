<style>
/* Layout: a calm, Cursor-style site. Home is a quiet landing: a left-aligned two-tone headline, a product window on a
   painted seascape, three doors, small cards and a footer with a theme switch. The tools open inside that same app
   window on a painting (wide screens) or full-bleed (phones). Type stays at weight 400; color only where it means
   something: orange = act (links, progress), blue = version A, violet = version B, green / red / orange = verdicts. */
:root {
  --bg: #f7f7f4;
  --card: #f2f1ed;
  --card-2: #ebeae5;
  --card-3: #e6e5e0;
  --card-4: #e1e0db;
  --field: #fcfcfa;
  --raise: #fcfcfa;
  --fg: #26251e;
  --fg-hover: #3b3a33;
  --sec: #6a6963;
  --ter: #9a9993;
  --line: #e2e1dc;
  --line-2: #cbcac4;
  --accent: #f54e00;
  --accent-ink: #c94100;
  --on-accent: #ffffff;
  --a: #3c6db3;
  --b: #8150bd;
  --good: #177a59;
  --bad: #c42b51;
  --island: #0f0e0a;
  --shadow-win: 0 0 0 1px rgba(38, 37, 30, 0.07), 0 28px 70px -24px rgba(38, 37, 30, 0.42), 0 10px 24px -12px rgba(38, 37, 30, 0.2);
  --shadow-pop: 0 0 16px rgba(0, 0, 0, 0.05), 0 0 8px rgba(0, 0, 0, 0.02);
  --sans: "Instrument Sans", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  --serif: "EB Garamond", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --maxw: 1200px;
  --ease: cubic-bezier(0.25, 1, 0.5, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14120b; --card: #1b1913; --card-2: #201e18; --card-3: #26241e; --card-4: #2b2923; --field: #1d1b15; --raise: #34322c;
    --fg: #edecec; --fg-hover: #d7d6d5; --sec: #a3a19c; --ter: #75736d; --line: #2c2a24; --line-2: #403e38;
    --accent: #f54e00; --accent-ink: #ff7b3d; --on-accent: #ffffff; --a: #8db0e8; --b: #bb9cea; --good: #3dbb8c; --bad: #ef6b8c; --island: #000000;
    --shadow-win: 0 0 0 1px rgba(237, 236, 236, 0.09), 0 28px 70px -24px rgba(0, 0, 0, 0.75), 0 10px 24px -12px rgba(0, 0, 0, 0.5);
    --shadow-pop: 0 0 16px rgba(0, 0, 0, 0.35), 0 0 8px rgba(0, 0, 0, 0.2);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14120b; --card: #1b1913; --card-2: #201e18; --card-3: #26241e; --card-4: #2b2923; --field: #1d1b15; --raise: #34322c;
  --fg: #edecec; --fg-hover: #d7d6d5; --sec: #a3a19c; --ter: #75736d; --line: #2c2a24; --line-2: #403e38;
  --accent: #f54e00; --accent-ink: #ff7b3d; --on-accent: #ffffff; --a: #8db0e8; --b: #bb9cea; --good: #3dbb8c; --bad: #ef6b8c; --island: #000000;
  --shadow-win: 0 0 0 1px rgba(237, 236, 236, 0.09), 0 28px 70px -24px rgba(0, 0, 0, 0.75), 0 10px 24px -12px rgba(0, 0, 0, 0.5);
  --shadow-pop: 0 0 16px rgba(0, 0, 0, 0.35), 0 0 8px rgba(0, 0, 0, 0.2);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 16px/1.5 var(--sans); letter-spacing: 0.005em; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.wrap { max-width: var(--maxw); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { font-weight: 400; margin: 0; text-wrap: balance; }
h1 { font-size: 26px; line-height: 1.25; letter-spacing: -0.0125em; }
h2 { font-size: 22px; line-height: 1.3; letter-spacing: -0.005em; }
h3 { font-size: 17px; line-height: 1.35; }
h4 { font-size: 14px; }
p { margin: 0; }
b, strong { font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); letter-spacing: 0; }
.muted { color: var(--sec); }
.small { font-size: 14px; }
.tiny { font-size: 12.5px; }
.grow { flex: 1; }
.ic { width: 16px; height: 16px; flex: none; }

/* Top: a note that this is a prototype, then the sticky header */
.notebar { background: var(--card); color: var(--sec); font-size: 13px; text-align: center; }
.notebar .wrap { padding-block: 7px; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
.top > .wrap { position: relative; display: flex; align-items: center; gap: 10px; height: 56px; }
.brand { display: inline-flex; align-items: center; gap: 9px; border: 0; background: none; padding: 0; cursor: pointer; color: var(--fg); min-width: 0; }
.brand svg { width: 22px; height: 22px; flex: none; }
.brand b { font-weight: 500; font-size: 16.5px; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav { display: none; }
.nav button { border: 1px solid transparent; background: none; padding: 5px 14px; border-radius: 999px; font-size: 14px; cursor: pointer; color: var(--fg); white-space: nowrap; }
.nav button:hover { background: var(--card-2); }
.nav button[aria-current="page"] { border-color: var(--line-2); }
#topcta { display: none; }
.menubtn { width: 38px; height: 38px; display: grid; place-items: center; border: 0; background: none; border-radius: 8px; cursor: pointer; color: var(--fg); padding: 0; }
.menubtn .ic { width: 20px; height: 20px; }
.menu { position: fixed; left: 0; right: 0; bottom: 0; z-index: 19; background: var(--bg); overflow: auto; }
.menu .wrap { display: grid; padding-block: 4px 32px; }
.menu button { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; font-size: 28px; line-height: 1.2; letter-spacing: -0.02em; cursor: pointer; color: var(--fg); }
.menu button .ic { width: 22px; height: 22px; color: var(--sec); }
@media (min-width: 600px) { #topcta { display: inline-flex; } }
@media (min-width: 1000px) {
  .nav { display: flex; gap: 2px; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .menubtn, .menu { display: none; }
}

/* Buttons, fields and small parts */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 20px;
  border-radius: 999px; border: 1px solid var(--fg); background: var(--fg); color: var(--bg); font-size: 16px; line-height: 1.2;
  cursor: pointer; text-align: center; text-decoration: none; transition: background-color 0.14s var(--ease), border-color 0.14s var(--ease);
}
.btn:hover { background: var(--fg-hover); border-color: var(--fg-hover); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn:disabled:hover { background: var(--fg); border-color: var(--fg); }
.btn.full { width: 100%; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line-2); }
.btn.ghost:hover { background: var(--card-2); }

.link { border: 0; background: none; padding: 0; color: var(--accent-ink); cursor: pointer; text-align: left; justify-self: start; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.back { border: 0; background: none; padding: 2px 0; color: var(--sec); font-size: 14px; cursor: pointer; justify-self: start; display: inline-flex; gap: 6px; align-items: center; }
.back:hover { color: var(--fg); }
.field { width: 100%; min-height: 42px; padding: 9px 12px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--field); color: var(--fg); }
.field:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
textarea.field { min-height: 72px; resize: vertical; line-height: 1.45; }
.lbl { font-size: 13.5px; color: var(--sec); display: grid; gap: 6px; }
.seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; padding: 3px; background: var(--card-2); border-radius: 10px; }
.seg button { min-height: 36px; padding: 6px 4px; border: 0; border-radius: 7px; background: none; font-size: 14px; color: var(--sec); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--fg); box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0, 0, 0, 0.06); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; cursor: pointer; }
.check input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--fg); flex: none; }
.note { font-size: 14px; color: var(--sec); background: var(--card); border-radius: 8px; padding: 10px 12px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; background: var(--card-2); color: var(--sec); font-size: 12.5px; line-height: 1.5; white-space: nowrap; }
.chip.ex { background: color-mix(in oklab, var(--accent) 12%, transparent); color: var(--accent-ink); }
.chip.a { background: color-mix(in oklab, var(--a) 13%, transparent); color: var(--a); }
.chip.b { background: color-mix(in oklab, var(--b) 13%, transparent); color: var(--b); }
.card { background: var(--card); border-radius: 8px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.stack { display: grid; gap: 10px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--sec); }
.steps span { padding: 2px 10px; border-radius: 999px; background: var(--card-2); }
.steps span.on { background: var(--fg); color: var(--bg); }
.proto { border: 1px dashed var(--line-2); border-radius: 8px; padding: 12px 14px; display: grid; gap: 10px; }
.proto > b { font: 500 11.5px/1.4 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--sec); }
.vk { display: inline-flex; align-items: center; gap: 7px; font: 500 11.5px/1.4 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--sec); }
.vk::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--sec); }
.verdict.win .vk::before, .mv.win .vk::before { background: var(--good); }
.verdict.unsure .vk::before, .mv.unsure .vk::before { background: var(--accent); }
.verdict.unfair .vk::before { background: var(--bad); }

/* Windows: a title bar with three dots, as on a desktop (".win" stays free for verdicts) */
.window { display: block; background: var(--bg); border-radius: 8px; box-shadow: var(--shadow-win); overflow: hidden; color: var(--fg); text-align: left; }
.winbar, .appbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; height: 30px; padding: 0 10px; background: var(--card); border-bottom: 1px solid var(--line); color: var(--sec); font-size: 12px; }

.dots { display: inline-flex; gap: 6px; }
.dots i { display: block; width: 10px; height: 10px; border-radius: 50%; background: var(--line-2); }

/* Paintings: drawn on a canvas at load and used as backgrounds */
.art { position: relative; display: block; overflow: hidden; border-radius: 4px; background: var(--card-3) center / cover no-repeat; background-image: var(--paint, none); }

/* Stage: home is a plain page; the tools sit in an app window on a painting */
.stage[data-mode="site"] .appbar, .stage[data-mode="site"] .side, .stage[data-mode="site"] .rail, .stage .appbar, .stage .side { display: none; }
.stage[data-mode="app"] > .wrap { padding-block: 12px 48px; }

.rail { min-width: 0; }

.rail details[open] summary::after { content: "−"; }
.rail ul { margin: 0; padding: 0 16px 16px 32px; display: grid; gap: 10px; font-size: 14px; color: var(--sec); line-height: 1.5; }
.rail li::marker { color: var(--ter); }
.rail li.more { list-style: none; }
@media (min-width: 720px) {
  .stage[data-mode="app"] .stage-art { border-radius: 4px; overflow: hidden; padding: 40px clamp(20px, 4vw, 56px) 56px; background: var(--card-3) center / cover no-repeat; background-image: var(--paint, none); }
  .stage[data-mode="app"] .appwin { position: relative; max-width: 1120px; margin: 0 auto; background: var(--bg); border-radius: 10px; box-shadow: var(--shadow-win); overflow: hidden; }
  .stage[data-mode="app"] .appbar { display: grid; height: 34px; font-size: 13px; padding: 0 12px; }

}
@media (min-width: 1080px) {

  .stage[data-mode="app"] .rail { border-top: 0; border-left: 1px solid var(--line); padding: 0; }

  .stage[data-mode="app"] .rail summary span { display: inline-flex; align-items: center; gap: 7px; height: 100%; padding: 0 14px; background: var(--bg); border-right: 1px solid var(--line); color: var(--fg); font-size: 13px; }
  .stage[data-mode="app"] .rail summary::after { content: none; }
  .stage[data-mode="app"] .rail ul { padding: 18px 20px 20px 34px; }
}

/* Sidebar inside the app window */
.side-h { display: flex; gap: 6px; padding: 12px 10px 6px; font-size: 11.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--sec); }
.side-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border: 0; border-radius: 6px; background: none; color: var(--fg); font-size: 14px; text-align: left; cursor: pointer; }

.task { display: flex; gap: 10px; align-items: flex-start; padding: 6px 10px; font-size: 14px; color: var(--sec); }

.task.done .ic { color: var(--good); }
.task.now .ic { color: var(--accent); }
.task small { display: block; font-size: 12.5px; color: var(--sec); }

/* Home */
.home { display: grid; gap: clamp(64px, 10vw, 128px); padding-block: 8px 72px; }

.hero .lede { color: var(--sec); }
.ctas { display: flex; flex-wrap: wrap; gap: 10px; }
.art-hero { height: clamp(240px, 50vw, 620px); }
.art-hero .demo { position: absolute; top: clamp(18px, 5.5%, 52px); left: clamp(18px, 7.5%, 110px); width: max(620px, calc(100% - 2 * clamp(18px, 7.5%, 110px))); height: 112%; display: flex; flex-direction: column; }
.demo-body { flex: 1; display: grid; grid-template-columns: 210px minmax(0, 1fr); min-height: 0; font-size: 13px; }

.demo-main { padding: 16px 20px; display: grid; gap: 16px; align-content: start; }
.dm-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; }
.dm-covers { display: grid; grid-template-columns: repeat(2, minmax(0, 108px)); gap: 20px; }

.dm-link { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; max-width: 420px; padding: 5px 5px 5px 12px; border-radius: 8px; background: var(--card-2); font: 12px/1.4 var(--mono); }
.dm-link span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dm-link .btn { pointer-events: none; min-height: 26px; padding: 2px 10px; font: 12px var(--sans); }
.demo-reader { display: none; }
.dr-card { display: grid; gap: 10px; justify-items: center; text-align: center; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--field); }

@media (min-width: 1000px) {
  .demo-body { grid-template-columns: 230px minmax(0, 1fr) 270px; }

}
.doors { display: grid; gap: 12px; }
.door { display: grid; text-align: left; padding: 0; border: 0; border-radius: 4px; background: var(--card); color: var(--fg); cursor: pointer; overflow: hidden; transition: background-color 0.14s var(--ease); }
.door:hover { background: var(--card-2); }

.feat-text { display: grid; gap: 2px; align-content: center; padding: 18px 18px 20px; }
.feat-text .h { display: block; font-size: 20px; line-height: 1.3; letter-spacing: -0.005em; }
.feat-text .p { display: block; font-size: 16px; line-height: 1.45; color: var(--sec); }
.feat-text .go { display: block; margin-top: 10px; color: var(--accent-ink); font-size: 15px; }
.art-feat { display: none; }
.mini { position: absolute; left: 9%; right: 9%; top: 10%; font-size: 13px; }

.mv { display: grid; gap: 4px; }
.mh { display: block; font-size: 21px; line-height: 1.2; letter-spacing: -0.01em; }
.mini-duel { display: grid; grid-template-columns: 62px 62px minmax(0, 1fr); gap: 12px; align-items: end; }

.mini-kw { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 10px; padding: 8px 0 0; border-top: 1px solid var(--line); }
.mini-kw .term { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-kw .nums { font-family: var(--mono); font-size: 11.5px; color: var(--sec); letter-spacing: 0; }
.mini-kw .pill { grid-row: 1 / span 2; grid-column: 2; align-self: center; }
.mini-save { display: grid; gap: 2px; padding: 10px 12px; border-radius: 6px; background: color-mix(in oklab, var(--good) 10%, var(--card)); }
.ms-n { font-size: 24px; line-height: 1.1; color: var(--good); letter-spacing: -0.02em; }
.ms-n small { font-size: 13px; color: var(--sec); letter-spacing: 0; }
@media (min-width: 720px) {
  .doors { gap: 24px; }
  .door { grid-template-columns: minmax(0, 1fr) minmax(0, 1.75fr); gap: 12px; padding: 12px; min-height: 440px; }

}
.sec-h { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 18px; }
.cards3 { display: grid; gap: 12px; }
.c3 { background: var(--card); border-radius: 4px; padding: 12px; display: grid; grid-template-rows: auto 1fr; gap: 14px; }
.c3-text { padding: 6px 6px 0; display: grid; gap: 2px; align-content: start; }
.c3-text h3 { font-size: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.c3-text p { color: var(--sec); }
.c3-text .link { margin-top: 10px; }
.c3-art { min-height: 250px; display: grid; place-items: center; padding: 22px; border-radius: 3px; overflow: hidden; }
.c3-art.plain { background: var(--card-3); }
.playcard { display: grid; gap: 8px; justify-items: center; text-align: center; width: 176px; padding: 14px; background: var(--bg); border-radius: 12px; box-shadow: var(--shadow-win); }
.playcard .cvwrap { width: 84px; }
.playcard .ask { font-size: 13px; }
.playcard .row { justify-content: center; }
.playcard .btn { pointer-events: none; min-height: 26px; padding: 2px 10px; font-size: 12px; }
.libviz { display: grid; gap: 12px; width: 100%; }
.dots9 { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 6px; }
.dots9 i { display: block; aspect-ratio: 2 / 3; border-radius: 2px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line-2); }
.dots9 i.on { background: var(--fg); box-shadow: none; }
.lv-n { font-size: 26px; line-height: 1.15; letter-spacing: -0.02em; }
.cli { width: 100%; }
.cli pre { margin: 0; padding: 12px 14px; font: 12px/1.75 var(--mono); color: var(--fg); white-space: pre-wrap; overflow-wrap: anywhere; }
.cli .ok { color: var(--good); }
.cli .go { color: var(--accent-ink); }
.log { display: grid; gap: 8px; }
.logc { background: var(--card); border-radius: 4px; padding: 12px 14px 14px; display: grid; gap: 2px; }

.cta { display: grid; justify-items: center; gap: 26px; text-align: center; }

@media (min-width: 720px) {
  .cards3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .log { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-width: 719px) { .hero h1, .hero .lede { font-size: 23px; } }

/* Footer */
.foot { background: var(--card); }
.foot .wrap { padding-block: 44px 28px; display: grid; gap: 40px; }
.fcols { display: grid; gap: 28px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.fcols h4 { color: var(--sec); margin-bottom: 10px; }
.fcols button { display: block; border: 0; background: none; padding: 3px 0; font-size: 14px; color: var(--fg); cursor: pointer; text-align: left; }
.fcols button:hover { text-decoration: underline; text-underline-offset: 3px; }
.fcols p { font-size: 14px; color: var(--sec); max-width: 44ch; }
.fbottom { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-size: 14px; color: var(--sec); }
.switch { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--card-3); }
.switch button { min-width: 30px; height: 26px; display: grid; place-items: center; border: 0; border-radius: 999px; background: none; color: var(--sec); cursor: pointer; padding: 0 9px; font-size: 13px; }
.switch button[aria-pressed="true"] { background: var(--raise); color: var(--fg); box-shadow: 0 0 0 1px var(--line); }
@media (min-width: 720px) { .fcols { grid-template-columns: 1fr 2fr 1fr; } }

/* Covers */
.cv { display: block; width: 100%; height: auto; border-radius: 3px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 20px -6px rgba(0, 0, 0, 0.28); }
img.cv { aspect-ratio: 2 / 3; object-fit: cover; background: var(--card-3); max-width: 100%; }
.cvwrap { display: block; max-width: 100%; }
.slots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.slot { display: grid; gap: 8px; align-content: start; min-width: 0; }

.slot .cvwrap { max-width: 168px; }
.upload { position: relative; overflow: hidden; }
.upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.idea { border-radius: 8px; border: 1px solid var(--line); background: var(--field); padding: 16px; min-height: 150px; display: grid; align-content: center; gap: 8px; font-family: var(--serif); font-size: 20px; line-height: 1.3; overflow-wrap: anywhere; }
.idea small { font: 500 11px/1.4 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--sec); }
.sharecard .idea { font-size: 13px; min-height: 120px; padding: 8px; }

/* Link */
.linkbox { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 6px 6px 14px; border-radius: 8px; background: var(--card-2); }
.linkbox code { font-family: var(--mono); font-size: 13.5px; overflow-wrap: anywhere; }
.where { display: flex; flex-wrap: wrap; gap: 6px; }

/* Phone frame (what a reader sees) */
.phone { width: min(300px, 100%); margin: 0 auto; border-radius: 46px; padding: 8px; background: var(--island); box-shadow: 0 0 0 1px var(--line-2), var(--shadow-pop); }
.screen { position: relative; border-radius: 38px; background: var(--bg); min-height: 540px; padding: 48px 16px 18px; display: grid; gap: 12px; align-content: start; overflow: hidden; }
.screen::before { content: ""; position: absolute; top: 12px; left: 50%; width: 84px; height: 24px; margin-left: -42px; border-radius: 999px; background: var(--island); }
.screen .from { font-size: 12.5px; color: var(--sec); display: flex; align-items: center; gap: 6px; }
.screen .from svg { width: 15px; height: 15px; }
.book { display: grid; gap: 10px; justify-items: center; text-align: center; }
.book .cvwrap { width: 150px; }
.book .hook { font-family: var(--serif); font-style: italic; font-size: 18px; line-height: 1.3; }
.ask { font-size: 17px; font-weight: 500; text-align: center; }
.vote { display: grid; gap: 8px; }
.anon { text-align: center; font-size: 12.5px; color: var(--sec); }
.firstpage { font-family: var(--serif); font-size: 16.5px; line-height: 1.5; background: var(--card); border-radius: 8px; padding: 12px 14px; }
.readerlog { font-size: 13px; color: var(--sec); text-align: center; }

/* Progress */
.pc { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.big { font-size: 40px; line-height: 1; letter-spacing: -0.03em; }
.meter { height: 6px; border-radius: 999px; background: var(--card-3); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.4s var(--ease); }
.split { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 14px; }
.split .bar2 { display: flex; height: 6px; border-radius: 999px; overflow: hidden; background: var(--card-3); }
.split .bar2 i { display: block; height: 100%; }
.ok { color: var(--good); }
.ko { color: var(--bad); }

/* Verdicts */
.verdict { border-radius: 8px; padding: 18px; display: grid; gap: 10px; background: var(--card); }
.verdict.unsure { background: color-mix(in oklab, var(--accent) 8%, var(--card)); }
.verdict.unfair { background: color-mix(in oklab, var(--bad) 8%, var(--card)); }

// Tiny A/B statistics helpers for the plan's charts, mockups and interactive companion (no dependencies).
// Same formulas as PLAN.md §3.19: two-sided alpha, 50/50 split, normal approximations.
(function (root) {
  "use strict";

  // Standard normal CDF via the complementary error function (Numerical Recipes erfcc, fractional error < 1.2e-7).
  function erfc(x) {
    const z = Math.abs(x);
    const t = 1 / (1 + 0.5 * z);
    const r = t * Math.exp(-z * z - 1.26551223 + t * (1.00002368 + t * (0.37409196 + t * (0.09678418 +
      t * (-0.18628806 + t * (0.27886807 + t * (-1.13520398 + t * (1.48851587 +
      t * (-0.82215223 + t * 0.17087277)))))))));
    return x >= 0 ? r : 2 - r;
  }
  function normCdf(x) { return 0.5 * erfc(-x / Math.SQRT2); }

  // Inverse normal CDF (Acklam's rational approximation, relative error < 1.15e-9).
  function normInv(p) {
    if (p <= 0 || p >= 1) throw new RangeError("p must be in (0, 1)");
    const a = [-39.69683028665376, 220.9460984245205, -275.9285104469687, 138.357751867269, -30.66479806614716, 2.506628277459239];
    const b = [-54.47609879822406, 161.5858368580409, -155.6989798598866, 66.80131188771972, -13.28068155288572];
    const c = [-0.007784894002430293, -0.3223964580411365, -2.400758277161838, -2.549732539343734, 4.374664141464968, 2.938163982698783];
    const d = [0.007784695709041462, 0.3224671290700398, 2.445134137142996, 3.754408661907416];
    const lo = 0.02425, hi = 1 - lo;
    let q, r, x;
    if (p < lo) {
      q = Math.sqrt(-2 * Math.log(p));
      x = (((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1);
    } else if (p <= hi) {
      q = p - 0.5; r = q * q;
      x = (((((a[0] * r + a[1]) * r + a[2]) * r + a[3]) * r + a[4]) * r + a[5]) * q / (((((b[0] * r + b[1]) * r + b[2]) * r + b[3]) * r + b[4]) * r + 1);
    } else {
      q = Math.sqrt(-2 * Math.log(1 - p));
      x = -(((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1);
    }
    return x;
  }

  // Visitors needed per variant to detect a relative lift in a conversion rate (PLAN.md §3.19 formula).
  function nPerArm(p1, relLift, alpha = 0.05, power = 0.8) {
    const p2 = p1 * (1 + relLift);
    const pBar = (p1 + p2) / 2;
    const za = normInv(1 - alpha / 2), zb = normInv(power);
    const num = za * Math.sqrt(2 * pBar * (1 - pBar)) + zb * Math.sqrt(p1 * (1 - p1) + p2 * (1 - p2));
    return (num * num) / ((p2 - p1) * (p2 - p1));
  }

  // Months of traffic for both variants together, given monthly visitors and the share sent into the test.
  function monthsNeeded(visitorsPerMonth, p1, relLift, share = 1) {
    return (2 * nPerArm(p1, relLift)) / (visitorsPerMonth * share);
  }

  // Smallest relative lift detectable with n visitors per variant (bisection on nPerArm).
  function mdeRel(n, p1, alpha = 0.05, power = 0.8) {
    let lo = 1e-4, hi = Math.min(50, 1 / p1 - 1 - 1e-9);
    if (nPerArm(p1, hi, alpha, power) > n) return Infinity;
    for (let i = 0; i < 100; i++) {
      const mid = (lo + hi) / 2;
      if (nPerArm(p1, mid, alpha, power) > n) lo = mid; else hi = mid;
    }
    return hi;
  }

  // Two-proportion z-test: pooled test, unpooled 95% CI for the difference B - A.
  function zTest(xA, nA, xB, nB) {
    const pA = xA / nA, pB = xB / nB, diff = pB - pA;
    const pPool = (xA + xB) / (nA + nB);
    const sePool = Math.sqrt(pPool * (1 - pPool) * (1 / nA + 1 / nB));
    const se = Math.sqrt(pA * (1 - pA) / nA + pB * (1 - pB) / nB);
    const z = diff / sePool;
    const zc = normInv(0.975);
    return { pA, pB, diff, ci: [diff - zc * se, diff + zc * se], z, p: 2 * (1 - normCdf(Math.abs(z))) };
  }

  // Sample-ratio mismatch for a planned 50/50 split (chi-square, 1 df).
  function srmP(nA, nB) {
    const chi2 = ((nA - nB) * (nA - nB)) / (nA + nB);
    return 2 * (1 - normCdf(Math.sqrt(chi2)));
  }

  // Normal-normal posterior on the log-odds ratio of B vs A; prior N(mu, tau^2) (tau = Infinity: flat).
  function posterior(xA, nA, xB, nB, mu = 0, tau = Infinity) {
    const a = xA + 0.5, b = nA - xA + 0.5, c = xB + 0.5, d = nB - xB + 0.5;
    const est = Math.log(c / d) - Math.log(a / b);
    const se2 = 1 / a + 1 / b + 1 / c + 1 / d;
    const precision = 1 / se2 + (isFinite(tau) ? 1 / (tau * tau) : 0);
    const mean = (est / se2 + (isFinite(tau) ? mu / (tau * tau) : 0)) / precision;
    const sd = Math.sqrt(1 / precision);
    const pBetter = normCdf(mean / sd);
    // Expected loss (in log-odds) of choosing B: E[max(0, -theta)].
    const phi = Math.exp(-0.5 * (mean / sd) ** 2) / Math.sqrt(2 * Math.PI);
    const lossB = sd * phi - mean * (1 - pBetter);
    return { est, se: Math.sqrt(se2), mean, sd, pBetter, lossB };
  }

  // Chance that a test with n per variant ends significant and positive, averaged over a prior on the true log-odds ratio.
  function assurance(n, p1, mu, tau, alpha = 0.05) {
    const se = Math.sqrt(2 / (n * p1 * (1 - p1)));
    const za = normInv(1 - alpha / 2);
    return normCdf((mu - za * se) / Math.sqrt(se * se + tau * tau));
  }

  const api = { normCdf, normInv, nPerArm, monthsNeeded, mdeRel, zTest, srmP, posterior, assurance };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.ABStats = api;

  // What a box's card says when it is tapped: what it does, where it lives in the repo, why it was necessary (the
  // interview answers of plan v4.0 §3.0, shortened) and what it costs.
  const FREE = L("$0", "$0");
  const DETAILS = {
    reader: { what: L("The reader opens the Duel link and sees one version, picked at random from a hash of the Duel and the visitor. One tap answers “Would you read the first page?”", "La lectora abre el enlace del duelo y ve una sola versión, elegida al azar con un hash del duelo y de la visitante. Un toque responde «¿Leerías la primera página?»."),
      where: "web/src/pages/duel (reader view)", why: L("One version per person and hidden votes make it a real A/B test, not a poll.", "Una versión por persona y votos ocultos lo vuelven una prueba A/B de verdad, no una encuesta."), cost: FREE },
    writer: { what: L("The progress page shows how many readers voted and whether the split looks fair, but never the winner before the target of 330 readers. The server refuses to send the answers early.", "La página de progreso muestra cuántos lectores votaron y si el reparto se ve justo, pero nunca el ganador antes de la meta de 330 lectores. El servidor se niega a mandar las respuestas antes."),
      where: "web/src/pages/duel (progress), edge/src", why: L("Stopping on a lucky streak is how people pick the wrong cover. The rules are set before the game.", "Parar con una racha de suerte es como se elige la portada equivocada. Las reglas se fijan antes del partido."), cost: FREE },
    cdn: { what: L("Serves the static React site from a private S3 bucket, routes /v1/* to the Duel Lambda and /covers/* to the covers bucket, all from one domain, with a WAF rate rule on /v1/*.", "Sirve el sitio estático en React desde un bucket privado de S3, manda /v1/* a la Lambda del duelo y /covers/* al bucket de portadas, todo desde un dominio, con una regla de WAF que limita /v1/*."),
      where: "infra/stacks/site.py, web/", why: L("One public door: no CORS, one place for a rate limit, and no credential ever reaches the browser. The site's data is small JSON written by the daily run, so a page never runs a query, and the flat-rate plan never bills overages.", "Una sola puerta pública: sin CORS, un solo lugar para limitar y ninguna credencial llega al navegador. Los datos del sitio son JSON pequeños que escribe la corrida diaria, así que una página nunca corre una consulta, y el plan de tarifa plana nunca cobra excedentes."),
      cost: L("$0 (flat-rate Free plan: 1 M requests, 100 GB)", "$0 (plan Free de tarifa plana: 1 M pedidos, 100 GB)") },
    lambda: { what: L("The Duel service's handlers in TypeScript: create a Duel, take a vote, show progress, share a result. Also the daily export of votes out of DynamoDB and a job that rotates the daily salt at midnight UTC.", "Los manejadores del servicio del duelo en TypeScript: crear un duelo, recibir un voto, mostrar el progreso, compartir un resultado. También el export diario de votos desde DynamoDB y un job que cambia la sal diaria a medianoche UTC."),
      where: "edge/src, lambdas/, infra/stacks/edge.py", why: L("Everything short and event-driven fits Lambda's free million requests a month. Function URLs with IAM auth, signed only by CloudFront, replace API Gateway, whose free tier ends after a year. The rule: Spark goes to Databricks; anything under 15 minutes and light on data goes to Lambda.", "Todo lo corto y por eventos cabe en el millón de pedidos gratis al mes de Lambda. Las function URLs con auth IAM, firmadas solo por CloudFront, reemplazan a API Gateway, cuyo nivel gratis acaba al año. La regla: Spark va a Databricks; lo que dura menos de 15 minutos y mueve pocos datos va a Lambda."),
      cost: L("$0 (1 M requests, 400,000 GB-s a month)", "$0 (1 M pedidos, 400.000 GB-s al mes)") },
    dynamo: { what: L("Stores Duels and counts. A vote is one conditional write of a hash of date + IP + Duel, with a salt that changes every day, then one counter update. The IP is never stored.", "Guarda duelos y conteos. Un voto es una escritura condicional de un hash de fecha + IP + duelo, con una sal que cambia cada día, y luego un contador. La IP nunca se guarda."),
      where: "edge/src/votes.ts, edge/test (D34, D49, D56)", why: L("The conditional write is the one-vote-per-visitor rule: atomic, with no race. Provisioned capacity inside the free 25 writes a second means a burst of readers slows down instead of billing; at real scale it would switch to on-demand.", "La escritura condicional es la regla de un voto por visitante: atómica, sin carreras. La capacidad aprovisionada dentro de las 25 escrituras por segundo gratis hace que una ola de lectores vaya más lento en vez de cobrar; a escala real pasaría a on-demand."),
      cost: L("$0 (25 reads + 25 writes a second, 25 GB)", "$0 (25 lecturas + 25 escrituras por segundo, 25 GB)") },
    sfn: { what: L("Creating a Duel starts one execution: wait until day 14, close the Duel if 330 readers haven't already, wait until 30 days after the end, delete the covers, done.", "Crear un duelo arranca una ejecución: esperar al día 14, cerrar el duelo si 330 lectores no lo cerraron antes, esperar 30 días después del final, borrar las portadas, listo."),
      where: "infra/statemachines/duel_lifecycle.asl.json", why: L("Long timers per Duel, with a visible history. A nightly cleanup would scan every Duel to find the ones due; the state machine knows, and its history proves the covers were really deleted, which the privacy promise needs.", "Temporizadores largos por duelo, con historia visible. Una limpieza nocturna tendría que revisar cada duelo para hallar los que vencen; la máquina de estados lo sabe, y su historia prueba que las portadas se borraron de verdad, como exige la promesa de privacidad."),
      cost: L("$0 (4,000 transitions a month ≈ 650 Duels)", "$0 (4.000 transiciones al mes ≈ 650 duelos)") },
    doctor: { what: L("Reads an Amazon Ads search-term report inside the browser and compares each keyword with the book's own average (a beta-binomial model): Stop, Keep, Luck or Wait.", "Lee en el navegador un informe de términos de búsqueda de Amazon Ads y compara cada palabra clave con el promedio del libro (un modelo beta-binomial): Parar, Mantener, Suerte o Esperar."),
      where: "web/src/pages/doctor, web/src/stats", why: L("An ad report is private: the file never leaves the browser, so a writer's numbers never leave their phone.", "Un informe de anuncios es privado: el archivo nunca sale del navegador, así que los números de una autora no salen de su teléfono."), cost: FREE },
    luck: { what: L("Two sales counts, before and after a change, an exact test adjusted for the days, and an honest answer: it's real, or you can't tell yet.", "Dos conteos de ventas, antes y después de un cambio, una prueba exacta ajustada por días y una respuesta honesta: es real, o todavía no se puede saber."),
      where: "web/src/pages/luck, web/src/stats", why: L("It isn't an experiment, so for a sure answer about a cover or a title it points to a Duel.", "No es un experimento, así que para una respuesta segura sobre una portada o un título manda a un duelo."), cost: FREE },
    daily: { what: L("Every day at 06:00 in Bogotá (11:00 UTC) one workflow runs the morning in order: Kafka and one simulated day, the bridge to S3, the vote export, the sync into the volume, the Databricks Job (it waits), the notebooks' export, then site_export and publish.", "Cada día a las 06:00 de Bogotá (11:00 UTC) un workflow corre la mañana en orden: Kafka y un día simulado, el puente a S3, el export de votos, la sincronización al volumen, el Job de Databricks (espera), el export de los notebooks, y luego site_export y publicar."),
      where: ".github/workflows/daily-e2e.yml, infra/stacks/ci.py", why: L("Free for a public repo, and no AWS keys: GitHub signs in with OIDC, AWS trusts its token for this repository only, and each workflow can assume only its own role. Not Airflow: GitHub runs Kafka anyway and Databricks Jobs runs the Spark side; a third orchestrator would be for show.", "Gratis para un repo público y sin llaves de AWS: GitHub entra con OIDC, AWS confía en su token solo para este repositorio y cada workflow asume solo su propio rol. No Airflow: GitHub ya corre Kafka y Databricks Jobs corre la parte de Spark; un tercer orquestador sería de adorno."), cost: FREE },
    votes: { what: L("Each morning a Lambda (export_edge) copies yesterday's new Duel votes, shared results and withdrawals out of DynamoDB into one JSONL file in S3.", "Cada mañana una Lambda (export_edge) copia de DynamoDB los votos nuevos de ayer, los resultados compartidos y los retiros en un archivo JSONL en S3."),
      where: "lambdas/export_edge/, contracts/", why: L("Real votes join the same lakehouse as everything else. They skip Kafka on purpose: a few hundred a day fit in one file, and a broker for them would have to run all day.", "Los votos reales entran al mismo lakehouse que todo lo demás. No pasan por Kafka a propósito: unos cientos al día caben en un archivo, y un broker para ellos tendría que estar encendido todo el día."), cost: FREE },
    sim: { what: L("70,000 fictional shoppers on a real Project Gutenberg catalog. Each one gets A or B from a hash of their ID. The program plants known effects and scheduled faults.", "70.000 compradores ficticios en un catálogo real de Project Gutenberg. Cada uno recibe A o B por un hash de su ID. El programa planta efectos conocidos y fallas programadas."),
      where: "src/ebook_ab/simulator/ (backfill | live)", why: L("Real traffic costs money. A simulation with a known answer proves that the pipeline and the statistics find it.", "El tráfico real cuesta dinero. Una simulación con respuesta conocida prueba que el pipeline y la estadística la encuentran."), cost: FREE },
    open: { what: L("4,873 real headline A/B tests from the Upworthy Research Archive (CC BY 4.0), and the Project Gutenberg catalog (CC0 metadata), uploaded to S3 as files.", "4.873 pruebas A/B reales de titulares del Upworthy Research Archive (CC BY 4.0) y el catálogo de Project Gutenberg (metadatos CC0), subidos a S3 como archivos."),
      where: "src/ebook_ab/realdata/, notebooks/12_real_headlines.py", why: L("It checks the method on experiments that really happened, and keeps the tools' expectations realistic.", "Prueba el método con experimentos que de verdad pasaron y mantiene realistas las expectativas de las herramientas."), cost: FREE },
    kafka: { what: L("A throwaway Kafka inside the GitHub Actions run carries the simulated store: 5 topics, 2 partitions each, keyed by shopper. Two groups read it on their own: lakehouse-bridge (files to S3) and guardrail-monitor (hourly alerts on fraud, refunds and latency).", "Un Kafka desechable dentro de la corrida de GitHub Actions lleva la tienda simulada: 5 topics de 2 particiones, con clave por comprador. Lo leen dos grupos por su cuenta: lakehouse-bridge (archivos a S3) y guardrail-monitor (alertas por hora de fraude, reembolsos y latencia)."),
      where: "src/ebook_ab/bridge, src/ebook_ab/monitor, the kill test in tests/integration, ADR-002", why: L("One stream, several independent readers, and a restart that loses and repeats nothing: killing the bridge right after an upload left zero duplicates and zero offset gaps. Not Amazon MSK: it isn't on the Free plan, and MSK Serverless would cost about $548 a month for 20 minutes a day.", "Un flujo, varios lectores independientes y un reinicio que no pierde ni repite nada: matar el puente justo después de subir dejó cero duplicados y cero huecos de offsets. No Amazon MSK: no está en el plan Free, y MSK Serverless costaría unos $548 al mes por 20 minutos al día."), cost: FREE },
    s3: { what: L("The durable landing zone and replay log. The bridge, export_edge and the open-data uploads write here first, with deterministic names (topic, epoch, partition, offsets), so a re-upload writes the same object with the same bytes.", "La zona de llegada durable y el registro para repetir. El puente, export_edge y las subidas de datos abiertos escriben aquí primero, con nombres deterministas (topic, época, partición, offsets), así que volver a subir escribe el mismo objeto con los mismos bytes."),
      where: "infra/stacks/foundation.py, src/ebook_ab/tools/sync_volume.py, §3.3", why: L("The raw history must live somewhere we control. Free Edition can delete an inactive workspace and doesn't let us choose its storage, so S3 is the replay log: after a Silver rule changed, everything was rebuilt from S3 in dev.", "La historia cruda tiene que vivir en un lugar que controlamos. Free Edition puede borrar un espacio inactivo y no deja elegir su almacenamiento, así que S3 es el registro para repetir: cuando cambió una regla de Silver, todo se reconstruyó desde S3 en dev."),
      cost: L("Cents: S3 requests have no free allowance (sign-up credits pay them in year 1)", "Centavos: los pedidos a S3 no tienen cuota gratis (los créditos de registro los pagan el año 1)") },
    volume: { what: L("One sync step uploads only the new files from S3 into the Unity Catalog volume ops.lakehouse_files, under the same names. Auto Loader reads each new file once and records it in the pipeline's checkpoint; unexpected fields go to a rescued-data column.", "Un paso de sincronización sube solo los archivos nuevos de S3 al volumen de Unity Catalog ops.lakehouse_files, con los mismos nombres. Auto Loader lee cada archivo nuevo una vez y lo anota en el checkpoint del pipeline; los campos inesperados van a una columna de datos rescatados."),
      where: "src/ebook_ab/tools/sync_volume.py, pipelines/ebook/bronze.py", why: L("Free Edition only reaches trusted domains, so files are pushed in rather than read from S3. Names that never repeat plus overwrites off make it exactly once: running the sync and the pipeline twice uploaded zero files and added zero rows.", "Free Edition solo llega a dominios de confianza, así que los archivos se empujan adentro en vez de leerse desde S3. Nombres que no se repiten y sobrescritura apagada lo vuelven exactamente una vez: correr la sincronización y el pipeline dos veces subió cero archivos y sumó cero filas."), cost: FREE },
    bronze: { what: L("Ten streaming tables, loaded by Auto Loader: the raw events exactly as they arrived, with their Kafka coordinates, no parsing. Reset is disabled.", "Diez tablas de streaming que carga Auto Loader: los eventos crudos tal como llegaron, con sus coordenadas de Kafka, sin parseo. El reinicio está desactivado."),
      where: "pipelines/ebook/bronze.py", why: L("Silver and Gold can always be rebuilt from Bronze, and Bronze from S3.", "Silver y Gold siempre se pueden reconstruir desde Bronze, y Bronze desde S3."), cost: L("$0 (serverless, daily quota)", "$0 (serverless, cuota diaria)") },
    silver: { what: L("Typed events without duplicates (a one-hour watermark); bad records go to quarantine with the rule's name. Duel votes: double votes and bots out, and a fair-split check (SRM) per Duel. Personal data is hashed and masked. An AUTO CDC flow keeps each shopper's history (SCD type 2).", "Eventos tipados y sin duplicados (marca de agua de una hora); los registros malos van a cuarentena con el nombre de la regla. Votos del duelo: fuera votos dobles y bots, y una revisión de reparto justo (SRM) por duelo. Los datos personales van con hash y máscara. Un flujo AUTO CDC guarda la historia de cada comprador (SCD tipo 2)."),
      where: "pipelines/ebook/silver.py, config/quality/*.yml, src/ebook_ab/quality", why: L("Bad data must not reach writers. Pipeline expectations drop failing rows into quarantine, so nothing disappears silently; two rules stop the run: an unknown topic (a wiring bug) and clear personal data in Silver (a privacy leak).", "Los datos malos no deben llegar a las autoras. Las expectativas del pipeline mandan las filas que fallan a cuarentena, así nada desaparece en silencio; dos reglas detienen la corrida: un topic desconocido (un error de cableado) y datos personales en claro en Silver (una fuga de privacidad)."), cost: FREE },
    gold: { what: L("20 materialized views generated from one YAML file: funnels, exposures, conversion by version, guardrails and revenue, plus Duel results and the Duel library. Each view names who uses it.", "20 vistas materializadas generadas desde un archivo YAML: embudos, exposiciones, conversión por versión, límites de seguridad e ingresos, más resultados de duelos y la biblioteca de duelos. Cada vista dice quién la usa."),
      where: "config/gold_views.yml, pipelines/ebook/gold_factory.py", why: L("A new metric is a YAML entry, not new code, and the views refresh themselves inside the pipeline.", "Una métrica nueva es una entrada de YAML, no código nuevo, y las vistas se actualizan solas dentro del pipeline."), cost: FREE },
    stats: { what: L("Notebooks run as tasks of the daily Job: validity first (SRM, A/A, invariants), then the pre-registered tests: z-test, Welch, bootstrap, CUPED, Holm/BH. A data-quality notebook is a gate: if a check fails, the Job stops before publishing.", "Los notebooks corren como tareas del Job diario: primero la validez (SRM, A/A, invariantes), luego las pruebas registradas de antemano: prueba z, Welch, bootstrap, CUPED, Holm/BH. Un notebook de calidad es una compuerta: si una revisión falla, el Job se detiene antes de publicar."),
      where: "src/ebook_ab/stats, notebooks/10_ab_analysis, 11_validation, 20_dq_report, tests/vectors/", why: L("Three automated proofs: the analysis finds the effects planted in the simulator (95% intervals hold the truth 93–97% of the time over 500 seeds), 1,000 fake A/A splits give about 5% false alarms, and a broken split fails the SRM check. Notebooks hold no logic, only calls to the tested library.", "Tres pruebas automáticas: el análisis encuentra los efectos plantados en el simulador (los intervalos del 95% contienen la verdad entre 93 y 97% de las veces en 500 semillas), 1.000 repartos A/A falsos dan cerca de 5% de falsas alarmas, y un reparto roto falla la revisión SRM. Los notebooks no tienen lógica, solo llaman a la librería probada."), cost: FREE },
    pipeline: { what: L("One Lakeflow Spark Declarative Pipeline on serverless, triggered once a day by the ebook_daily Job, which then runs the notebooks. Each table is declared; the pipeline works out the order, the checkpoints and the retries. A Databricks bundle deploys it from Git.", "Un Lakeflow Spark Declarative Pipeline en serverless, que el Job ebook_daily dispara una vez al día y que después corre los notebooks. Cada tabla se declara; el pipeline resuelve el orden, los checkpoints y los reintentos. Un bundle de Databricks lo despliega desde Git."),
      where: "pipelines/ebook/, resources/ebook_daily.job.yml, databricks.yml, ADR-003", why: L("Serverless Spark, Delta and a declarative pipeline at $0, with no cluster to size or forget. Not Glue: it has no free allowance. Free Edition is non-commercial with a daily quota, which fits a portfolio: heavy proofs were split into a weekly run.", "Spark serverless, Delta y un pipeline declarativo a $0, sin clúster que dimensionar u olvidar. No Glue: no tiene cuota gratis. Free Edition es no comercial y tiene cuota diaria, lo que encaja con un portafolio: las pruebas pesadas pasaron a una corrida semanal."),
      cost: L("$0 (Free Edition has no payment method)", "$0 (Free Edition no tiene medio de pago)") },
    delta: { what: L("Every Bronze, Silver and Gold table is a Delta table managed by Unity Catalog: AUTO CDC for history and withdrawals, MERGE for results, time travel for reproducible memos, and the Change Data Feed on the results table.", "Cada tabla de Bronze, Silver y Gold es una tabla Delta gestionada por Unity Catalog: AUTO CDC para la historia y los retiros, MERGE para los resultados, time travel para memos reproducibles y el Change Data Feed en la tabla de resultados."),
      where: "pipelines/ebook/silver.py, notebooks/10_ab_analysis, ADR-006", why: L("Plain Parquet files can't be updated safely. Each decision memo records the table versions it used, so a time-travel query reproduces its exact numbers, and a writer's withdrawal really deletes their shared result. OPTIMIZE and VACUUM aren't needed at this size: they stay a labelled demo.", "Los archivos Parquet simples no se pueden actualizar con seguridad. Cada memo de decisión anota las versiones de tabla que usó, así una consulta time travel reproduce sus números exactos, y el retiro de una autora borra de verdad su resultado compartido. OPTIMIZE y VACUUM no hacen falta a este tamaño: quedan como demo etiquetada."), cost: FREE },
    uc: { what: L("Grants (bi_readers on Gold only, pii_readers can unmask), column masks on clear personal data in Bronze, tags for law and purpose (pii, ley_1581), and lineage from each column to the Gold view it feeds. The pepper sits in a Databricks secret scope.", "Permisos (bi_readers solo en Gold, pii_readers puede quitar máscaras), máscaras de columna sobre los datos personales en claro de Bronze, etiquetas de ley y propósito (pii, ley_1581) y linaje de cada columna hasta la vista Gold que alimenta. La pimienta vive en un secret scope de Databricks."),
      where: "resources/grants.yml, sql/verify/pii_checks.sql, ADR-005", why: L("The store's events carry fake personal data on purpose, to design as if Colombia's Ley 1581 applied. The tables live in Databricks, so Unity Catalog is the layer that really guards them; IAM guards the AWS side.", "Los eventos de la tienda traen datos personales falsos a propósito, para diseñar como si aplicara la Ley 1581 de Colombia. Las tablas viven en Databricks, así que Unity Catalog es la capa que de verdad las cuida; IAM cuida el lado de AWS."), cost: FREE },
    pages: { what: L("site_export turns small Gold summaries into JSON files, each checked against its schema, and publishes them with the static React site to a private S3 bucket behind CloudFront, in Spanish and English.", "site_export convierte resúmenes pequeños de Gold en archivos JSON, cada uno revisado contra su esquema, y los publica con el sitio estático en React en un bucket privado de S3 detrás de CloudFront, en español e inglés."),
      where: "src/ebook_ab/site_export/, web/, contracts/site/", why: L("The users are writers, not analysts: they need one clear answer, not a dashboard. A BI tool would charge per viewer to share publicly, and the site never holds a Databricks token.", "Las usuarias son autoras, no analistas: necesitan una respuesta clara, no un tablero. Una herramienta de BI cobraría por cada persona para compartir en público, y el sitio nunca guarda un token de Databricks."), cost: FREE },
    library: { what: L("Duel results pooled by genre, book language and what changed. A group shows numbers only after 5 results, and simulated data is never mixed in.", "Resultados de duelos agrupados por género, idioma del libro y qué cambió. Un grupo muestra números solo con 5 resultados, y nunca se mezclan datos simulados."),
      where: "web/public/data/library.json", why: L("Every Duel helps the next writer, even one who can't run a test.", "Cada duelo ayuda a la próxima autora, aunque no pueda hacer su propia prueba."), cost: FREE },

      "w.home": ["One rule: A/B testing is the engine, never the product. Each door starts from a pain, not from a statistics form.", "Only the Duel is a real experiment: each reader gets one version at random. The Ad Doctor and Real or luck use the same math on numbers you already have.", "Everything here runs in the browser. In the real tool only votes and opt-in results leave it."],
      "w.create": ["Images are shrunk in the browser before upload (about 60 KB), and deleted 30 days after the Duel ends.", "Same engine for covers, titles, blurbs and book ideas: two versions, one random version per person."],
      "w.link": ["The link is unlisted: only people you share it with can vote.", "Target size: enough readers to see a 30% → 45% difference, at 95% confidence and 80% power."],
      "w.reader": ["Each reader gets one version at random (in the real tool, a hash of the Duel and the visitor). Nobody sees both, and nobody sees the votes.", "That's what makes it a real A/B test, not a poll.", "The writer's own phone is not counted, and each visitor votes once."],

      "w.reveal": ["Verdict: a two-proportion z-test at 95%, the same math as the rest of the platform.", "“Too close” when the gap is under 5 points: a decision, not a failure.", "With the writer's OK, the result joins the library: that's how it fills itself."],
      "w.play": ["Vote to earn votes: the same idea Photofeeler uses for profile photos.", "Each card shows one version of another writer's Duel, at random: these votes count in that real A/B test.", "No accounts: the credit lives on your Duel's private link."],
      "w.doc": ["A/B-test math on your own report: each keyword is compared with your book's average (a beta-binomial model).", "It is not an experiment: Amazon decides who sees each keyword, so it tells you what loses money, not why.", "Break-even = cost per click ÷ what you earn per sale.", "The file is read in the browser; nothing is uploaded."],

  function coverIllus(lines, label) {
    const id = "c" + ++UID;
    const fs = lines.some((l) => l.length > 13) ? 17 : 20;
    return `<svg class="cv" viewBox="0 0 200 300" role="img" aria-label="${esc(label)}"><defs><linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffdcb8"/><stop offset=".55" stop-color="#f4aaa2"/><stop offset="1" stop-color="#9ccbe0"/></linearGradient></defs>` +
      `<rect width="200" height="300" fill="url(#${id}s)"/><circle cx="152" cy="98" r="20" fill="#fff4dc"/>` +
      `<path d="M0 214 L60 196 L104 206 L104 300 L0 300 Z" fill="#7a9a6e"/>` +
      `<rect x="56" y="130" width="15" height="74" fill="#fbf7f0"/><rect x="56" y="148" width="15" height="9" fill="#c4473a"/><rect x="56" y="170" width="15" height="9" fill="#c4473a"/>` +
      `<path d="M52 130 h23 l-4 -12 h-15 z" fill="#c4473a"/><rect x="59" y="110" width="9" height="8" fill="#ffe8a3"/><path d="M68 114 L130 100 L130 128 Z" fill="#fff6c9" opacity=".55"/>` +
      `<path d="M0 226 q25 -9 50 0 t50 0 t50 0 t50 0 V300 H0 Z" fill="#4e8fb0"/><path d="M0 246 q25 -9 50 0 t50 0 t50 0 t50 0 V300 H0 Z" fill="#336f8f"/>` +
      lines.map((l, i) => `<text x="100" y="${36 + i * (fs + 3)}" text-anchor="middle" font-family="${SERIF}" font-size="${fs}" font-style="italic" fill="#3d2a3f">${esc(l)}</text>`).join("") +
      `<text x="100" y="284" text-anchor="middle" font-family="${SANS}" font-size="9.5" letter-spacing="2.4" fill="#ffffff">${esc(BOOK.pen.toUpperCase())}</text></svg>`;
  }
  // Version B: a dark, dramatic cover with two people at sunset.
  function coverDrama(lines, label) {
    const id = "c" + ++UID;
    return `<svg class="cv" viewBox="0 0 200 300" role="img" aria-label="${esc(label)}"><defs><linearGradient id="${id}n" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d2633"/><stop offset=".55" stop-color="#1f5566"/><stop offset="1" stop-color="#e3814f"/></linearGradient>` +
      `<radialGradient id="${id}g" cx=".5" cy=".72" r=".5"><stop offset="0" stop-color="#ffc98b" stop-opacity=".9"/><stop offset="1" stop-color="#ffc98b" stop-opacity="0"/></radialGradient></defs>` +
      `<rect width="200" height="300" fill="url(#${id}n)"/><rect width="200" height="300" fill="url(#${id}g)"/>` +
      `<path d="M0 250 Q100 236 200 250 V300 H0 Z" fill="#0b1d26"/>` +
      `<circle cx="88" cy="186" r="10" fill="#0b1d26"/><path d="M74 252 Q76 204 88 199 Q100 204 102 252 Z" fill="#0b1d26"/>` +
      `<circle cx="113" cy="182" r="10.5" fill="#0b1d26"/><path d="M99 252 Q101 200 113 195 Q126 200 128 252 Z" fill="#0b1d26"/>` +
      lines.map((l, i) => `<text x="100" y="${46 + i * 30}" text-anchor="middle" font-family="${SANS}" font-weight="600" font-size="${i === lines.length - 1 ? 27 : 19}" letter-spacing="1.2" fill="#ffffff">${esc(l.toUpperCase())}</text>`).join("") +
      `<text x="100" y="284" text-anchor="middle" font-family="${SANS}" font-size="9.5" letter-spacing="3" fill="#f6d6b8">${esc(BOOK.pen.toUpperCase())}</text></svg>`;
  }
  // Covers of other writers' Duels, for the game.
  const POOL = [
    { g: "fantasy", t: { en: "The Ravens' Inheritance", es: "La herencia de los cuervos" }, pal: ["#1d1b33", "#b88b2e"] },
    { g: "romance", t: { en: "Coffee for Two Strangers", es: "Café para dos extraños" }, pal: ["#f2d0c4", "#7a3b3b"] },
    { g: "thriller", t: { en: "The Last Train to Valparaíso", es: "El último tren a Valparaíso" }, pal: ["#111417", "#c8352b"] },
    { g: "selfhelp", t: { en: "Small Habits, Big Life", es: "Hábitos pequeños, vida grande" }, pal: ["#f4f1e6", "#1f6f5c"] },
    { g: "kids", t: { en: "Lola and the Sleepy Dragon", es: "Lola y el dragón dormilón" }, pal: ["#bfe3f5", "#e86a3c"] },
    { g: "thriller", t: { en: "Salt in the Wound", es: "Sal en la herida" }, pal: ["#20262e", "#e0c23c"] },
    { g: "romance", t: { en: "Under the Bogotá Rain", es: "Bajo la lluvia de Bogotá" }, pal: ["#2b3550", "#f0a3b5"] },
    { g: "fantasy", t: { en: "The Glass Library", es: "La biblioteca de cristal" }, pal: ["#0f3b3a", "#9fe0d6"] },
  ];
  function coverGen(title, pal, style) {
    const id = "c" + ++UID;
    const lines = wrap(title, 12);
    const dark = parseInt(pal[0].slice(1, 3), 16) < 128;
    const ink = dark ? "#ffffff" : "#1b1b1b";
    let art = "";
    if (style === 0) art = `<rect y="168" width="200" height="132" fill="${pal[1]}"/><circle cx="148" cy="132" r="28" fill="${pal[1]}" opacity=".55"/>`;
    else art = `<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${pal[0]}"/><stop offset="1" stop-color="${pal[1]}"/></linearGradient></defs><rect width="200" height="300" fill="url(#${id})"/><path d="M0 230 L200 170 L200 300 L0 300 Z" fill="${pal[0]}" opacity=".45"/>`;
    const fs = style === 0 ? 19 : 21;
    const y0 = style === 0 ? 70 - (lines.length - 1) * 10 : 54;
    return `<svg class="cv" viewBox="0 0 200 300" role="img" aria-label="${esc(title)}"><rect width="200" height="300" fill="${pal[0]}"/>${art}` +
      lines.map((l, i) => `<text x="${style === 0 ? 18 : 100}" y="${y0 + i * (fs + 6)}" text-anchor="${style === 0 ? "start" : "middle"}" font-family="${style === 0 ? SERIF : SANS}" font-weight="${style === 0 ? 500 : 600}" font-size="${fs}" fill="${ink}">${esc(style === 0 ? l : l.toUpperCase())}</text>`).join("") +
      `</svg>`;
  }

  /* ---------- State ---------- */
  const TARGET = Math.ceil((2 * Math.ceil(S.nPerArm(0.3, 0.5))) / 10) * 10; // 30% -> 45% at 95% / 80%: 326, shown as 330
  const SCEN = { clear: { split: 0.5, A: 0.24, B: 0.41 }, close: { split: 0.5, A: 0.3, B: 0.31 }, broken: { split: 0.62, A: 0.3, B: 0.33 } };
  const freshDuel = () => ({
    step: "create", kind: "cover", genre: "romance", blang: "es", fp: true, notify: "instagram.com/marinasolano.escribe",
    up: { A: null, B: null }, text: { A: null, B: null }, id: "7KQ2",
    votes: { A: { n: 0, yes: 0 }, B: { n: 0, yes: 0 } }, scenario: "clear", readers: [], reader: null, toLib: true, copied: "",
  });
  const state = {
    view: "home",
    duel: freshDuel(),
    play: { i: 0, voted: 0, arms: [] },
    doc: { csv: null, file: "", royalty: 3.4, days: 30, filter: "all", result: null, error: "" },
    luck: { bs: 9, bd: 7, as: 14, ad: 7 },
    nerds: { sel: null, story: null, step: 0, auto: false, motion: true, filter: null, tool: null },
  };

  /* ---------- Duel ---------- */
  const textOf = (arm) => {
    const d = state.duel;
    if (d.text[arm] != null) return d.text[arm];
    const src = BOOK.texts[d.kind];
    return src ? src[arm][LANG] : "";
  };
  function versionHTML(arm, size) {
    const d = state.duel;
    const label = `${t(arm === "A" ? "duel.verA" : "duel.verB")}`;
    if (d.kind === "idea") return `<div class="idea"><small>${esc(label)}</small>${esc(textOf(arm))}</div>`;
    let cover;
    if (d.kind === "cover") {
      cover = d.up[arm] ? `<img class="cv" src="${d.up[arm].url}" alt="${esc(label)}">` : (arm === "A" ? coverIllus(BOOK.title[LANG], label) : coverDrama(BOOK.title[LANG], label));
    } else if (d.kind === "title") cover = coverIllus(wrap(textOf(arm), 14), label);
    else cover = coverIllus(BOOK.title[LANG], label);
    return `<div class="cvwrap" style="${size ? `width:${size}px` : ""}">${cover}</div>`;
  }
  const hookOf = (arm) => (state.duel.kind === "blurb" ? textOf(arm) : BOOK.hook[LANG]);
  function newReader() {
    const d = state.duel;
    const arm = rng() < SCEN[d.scenario].split ? "A" : "B";
    d.reader = { n: d.votes.A.n + d.votes.B.n + 1, arm, voted: null };
  }
  function addReaders(k) {
    const d = state.duel, sc = SCEN[d.scenario];
    for (let i = 0; i < k; i++) {
      const arm = rng() < sc.split ? "A" : "B";
      d.votes[arm].n++;
      if (rng() < sc[arm]) d.votes[arm].yes++;
    }
  }
  const total = () => state.duel.votes.A.n + state.duel.votes.B.n;
  function duelVerdict() {
    const v = state.duel.votes;
    const nA = v.A.n, nB = v.B.n;
    const srm = S.srmP(nA, nB);
    if (srm < 0.001) return { kind: "unfair", srm };
    const z = S.zTest(v.A.yes, nA, v.B.yes, nB);
    const lead = z.diff >= 0 ? "B" : "A";
    if (z.p < 0.05) return { kind: "win", arm: lead, z, srm };
    if (Math.abs(z.diff) < 0.05) return { kind: "close", z, srm };
    const low = Math.min(z.pA, z.pB);
    const need = 2 * Math.ceil(S.nPerArm(Math.max(0.01, low), Math.abs(z.diff) / Math.max(0.01, low))) - (nA + nB);
    return { kind: "unsure", arm: lead, z, srm, more: Math.max(10, Math.ceil(need / 10) * 10) };
  }
  function stepsHTML(on) {
    return `<div class="steps">${[1, 2, 3, 4].map((i) => `<span class="${i === on ? "on" : ""}">${esc(t("step." + i))}</span>`).join("")}</div>`;
  }
  function viewDuel() {
    const d = state.duel;
    if (d.step === "create") {
      const kinds = ["cover", "title", "blurb", "idea"];
      const slot = (arm) => {
        const up = d.up[arm];
        const editor = d.kind === "cover"
          ? `<label class="btn ghost sm upload">${IC.upload}${esc(t("duel.upload"))}<input type="file" accept="image/*" id="up${arm}" aria-label="${esc(t("duel.upload"))} ${arm}"></label>${up ? `<p class="tiny muted">${esc(t("duel.kb", { kb: nf(up.kb) }))}</p>` : ""}`
          : `<textarea class="field" id="tx${arm}" rows="3" aria-label="${esc(t(arm === "A" ? "duel.textA" : "duel.textB"))}">${esc(textOf(arm))}</textarea>`;
        return `<div class="slot ${arm.toLowerCase()}"><span class="chip ${arm.toLowerCase()} tag">${esc(t(arm === "A" ? "duel.verA" : "duel.verB"))}</span>${versionHTML(arm)}${editor}</div>`;
      };
      return `${back()}${stepsHTML(1)}<h1>${esc(t("duel.h"))}</h1>
        <div class="card"><div class="lbl">${esc(t("duel.q"))}</div>
          <div class="seg" role="group" aria-label="${esc(t("duel.q"))}">${kinds.map((k) => `<button type="button" data-act="kind" data-kind="${k}" aria-pressed="${d.kind === k}">${esc(t("kind." + k))}</button>`).join("")}</div>
          <div class="slots">${slot("A")}${slot("B")}</div>
          ${d.kind === "cover" ? `<p class="tiny muted">${esc(t("duel.sample"))}</p>` : ""}
        </div>
        <div class="card">
          <div class="pair">
            <label class="lbl">${esc(t("duel.genre"))}<select class="field" id="genre">${["romance", "fantasy", "thriller", "selfhelp", "kids"].map((g) => `<option value="${g}" ${d.genre === g ? "selected" : ""}>${esc(t("g." + g))}</option>`).join("")}</select></label>
            <label class="lbl">${esc(t("duel.lang"))}<select class="field" id="blang">${["es", "en"].map((l) => `<option value="${l}" ${d.blang === l ? "selected" : ""}>${esc(t("bl." + l))}</option>`).join("")}</select></label>
          </div>
          <label class="check"><input type="checkbox" id="fp" ${d.fp ? "checked" : ""}><span>${esc(t("duel.fp"))}</span></label>
          <label class="lbl">${esc(t("duel.notify"))}<input class="field" id="notify" value="${esc(d.notify)}" autocomplete="off"></label>
        </div>
        <button type="button" class="btn full" data-act="create">${esc(t("duel.create"))}${IC.arrow}</button>`;
    }
    if (d.step === "link") {
      const url = `pipe199x.github.io/ebook-ab-platform/d/${d.id}`;
      return `${back()}${stepsHTML(2)}<h1>${esc(t("link.h"))}</h1>
        <p class="muted">${esc(t("link.p"))}</p>
        <div class="slots">${["A", "B"].map((a) => `<div class="slot ${a.toLowerCase()}"><span class="chip ${a.toLowerCase()} tag">${esc(t(a === "A" ? "duel.verA" : "duel.verB"))}</span>${versionHTML(a, 140)}</div>`).join("")}</div>
        <div class="linkbox"><code id="dlink">${esc(url)}</code><button type="button" class="btn sm" data-act="copy" data-text="https://${esc(url)}">${IC.copy}${esc(d.copied === "link" ? t("link.copied") : t("link.copy"))}</button></div>
        <div class="stack"><div class="lbl">${esc(t("link.where"))}</div><div class="where">${["Instagram", "WhatsApp", "Facebook", "Wattpad", "TikTok", "Newsletter"].map((w) => `<span class="chip">${w}</span>`).join("")}</div></div>
        <p class="note">${esc(t("link.target", { n: nf(TARGET) }))}</p>
        <div class="row"><button type="button" class="btn" data-act="reader">${esc(t("link.reader"))}</button><button type="button" class="btn ghost" data-act="progress">${esc(t("link.progress"))}</button></div>`;
    }
    if (d.step === "reader") {
      if (!d.reader) newReader();
      const r = d.reader;
      const inner = r.voted == null
        ? `<div class="book" data-arm="${r.arm}">${versionHTML(r.arm, 150)}${d.kind === "idea" ? "" : `<p class="hook">${esc(hookOf(r.arm))}</p>`}</div>
           <p class="ask">${esc(t("r.ask"))}</p>
           <div class="vote"><button type="button" class="btn" data-act="vote" data-v="yes">${esc(t("r.yes"))}</button><button type="button" class="btn ghost" data-act="vote" data-v="no">${esc(t("r.no"))}</button></div>
           <p class="anon">${esc(t("r.anon"))}</p>`
        : `<h2>${esc(t("r.thanks"))}</h2><p>${esc(t("r.saw", { arm: r.arm, things: t("things." + d.kind) }))}</p>
           ${d.fp ? `<div class="stack"><div class="lbl">${esc(t("r.fp"))}</div><p class="firstpage">${esc(BOOK.page[LANG])}</p></div>` : ""}
           ${d.notify ? `<p><span class="link">${esc(t("r.notify"))}</span> <span class="tiny muted">${esc(d.notify)}</span></p>` : ""}
           <p><button type="button" class="link" data-act="go" data-view="duel" data-reset="1">${esc(t("r.loop"))}</button></p>`;
      const log = d.readers.slice(-8).map((x) => `#${x.n} ${x.arm}`).join(" · ");
      return `${back()}${stepsHTML(3)}
        <div class="phone"><div class="screen" id="screen"><div class="from">${MARK}${esc(t("r.from"))}</div>${inner}</div></div>
        <p class="readerlog">${esc(t("r.you", { n: r.n }))}</p>
        ${log ? `<p class="readerlog" id="rlog">${esc(t("r.log", { log }))}</p>` : ""}
        <div class="row" style="justify-content:center"><button type="button" class="btn soft" data-act="next">${esc(t("r.next"))}</button><button type="button" class="btn ghost" data-act="progress">${esc(t("link.progress"))}</button></div>`;
    }
    if (d.step === "progress") {
      const n = total(), A = d.votes.A.n, B = d.votes.B.n;
      const srm = n ? S.srmP(A, B) : 1;
      const fair = srm >= 0.001;
      return `${back()}${stepsHTML(3)}<h1>${esc(t("p.h"))}</h1>
        <div class="card">
          <div class="pc"><span class="big num" id="pcount">${nf(n)}</span><span class="muted">${esc(t("p.of", { n: nf(TARGET) }))}</span></div>
          <div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="${TARGET}" aria-valuenow="${Math.min(n, TARGET)}"><i style="width:${Math.min(100, (n / TARGET) * 100).toFixed(1)}%"></i></div>
          <p class="small muted">${esc(t("p.peek"))}</p>
          <div class="split"><span class="small">${esc(t("p.split"))}</span><span class="bar2"><i class="a" style="width:${n ? ((A / n) * 100).toFixed(1) : 50}%"></i><i class="b" style="width:${n ? ((B / n) * 100).toFixed(1) : 50}%"></i></span><span class="num small mono">A ${nf(A)} · B ${nf(B)}</span></div>
          <p class="small">${n ? `<span class="${fair ? "ok" : "ko"}" id="splitok">${esc(fair ? t("p.fair") : t("p.broken"))}</span> · ` : ""}<span class="muted">${esc(t("p.ends", { n: nf(TARGET) }))}</span></p>
          <button type="button" class="btn full" data-act="reveal" ${n >= TARGET ? "" : "disabled"}>${esc(n >= TARGET ? t("p.reveal") : t("p.wait", { n: nf(TARGET) }))}</button>
        </div>
        <div class="proto"><b>${esc(t("proto.h"))}</b>
          <label class="lbl">${esc(t("proto.think"))}<select class="field" id="scenario">${["clear", "close", "broken"].map((s) => `<option value="${s}" ${d.scenario === s ? "selected" : ""}>${esc(t("sc." + s))}</option>`).join("")}</select></label>
          <div class="row"><button type="button" class="btn soft sm" data-act="add">${esc(t("proto.add"))}</button><button type="button" class="btn soft sm" data-act="fill">${esc(t("proto.fill", { n: nf(TARGET) }))}</button><button type="button" class="btn ghost sm" data-act="reader">${esc(t("link.reader"))}</button></div>
        </div>`;
    }
    // reveal
    const v = duelVerdict();
    const z = v.z || S.zTest(d.votes.A.yes, Math.max(1, d.votes.A.n), d.votes.B.yes, Math.max(1, d.votes.B.n));
    const rateA = d.votes.A.yes / Math.max(1, d.votes.A.n), rateB = d.votes.B.yes / Math.max(1, d.votes.B.n);
    let head, body;
    if (v.kind === "win") {
      const w = v.arm === "B" ? rateB : rateA, l = v.arm === "B" ? rateA : rateB;
      head = t("v.win.h", { arm: v.arm });
      body = esc(t("v.win.p", { arm: v.arm, w: pct(w), l: pct(l), chance: chance(z.p) }));
    } else if (v.kind === "close") { head = esc(t("v.close.h")); body = esc(t("v.close.p")); }
    else if (v.kind === "unsure") { head = esc(t("v.unsure.h")); body = esc(t("v.unsure.p", { arm: v.arm, d: pts(Math.abs(z.diff)), more: nf(v.more) })); }
    else { head = esc(t("v.unfair.h")); body = esc(t("v.unfair.p", { a: nf(d.votes.A.n), b: nf(d.votes.B.n) })); }
    const max = Math.max(rateA, rateB, 0.01);
    const bars = `<div class="bars"><div class="lbl">${esc(t("v.bars"))}</div>${[["A", rateA], ["B", rateB]].map(([a, r]) => `<div class="barrow"><b>${a}</b><span class="track"><i class="${a.toLowerCase()}" style="width:${((r / max) * 100).toFixed(1)}%"></i></span><span class="num">${pct(r)}%</span></div>`).join("")}</div>`;
    const showCard = v.kind === "win" || v.kind === "close";
    const winArm = v.kind === "win" ? v.arm : null;
    const cardSay = v.kind === "win" ? t("card.win", { thing: t("thing." + d.kind) }) : t("card.close", { things: t("things." + d.kind) });
    const w = winArm === "A" ? rateA : rateB, l = winArm === "A" ? rateB : rateA;
    const cardMeta = t("card.meta", { n: nf(total()), w: pct(winArm ? w : rateB), l: pct(winArm ? l : rateA) }) + (v.kind === "win" ? ` · ${t("card.notluck")}` : "");
    const card = showCard ? `<div class="sharecard" id="sharecard">
        <div class="art sc-art ${paintClass("harbor")}"><div class="covers">${["A", "B"].map((a) => `<div class="${winArm ? (a === winArm ? "won" : "lost") : ""}">${versionHTML(a)}</div>`).join("")}</div></div>
        <div class="sc-text"><p class="say">${esc(cardSay)}</p><p class="meta num">${esc(cardMeta)}</p><p class="made">${esc(t("card.made"))}</p></div></div>
        <div class="row"><button type="button" class="btn ghost sm" data-act="copy" data-text="${esc(cardSay + " " + cardMeta)}">${IC.copy}${esc(d.copied === "card" ? t("v.copied") : t("v.copy"))}</button></div>
        <label class="check"><input type="checkbox" id="toLib" ${d.toLib ? "checked" : ""}><span>${esc(t("v.lib"))}<br><span class="tiny muted">${esc(t("v.libnote"))}</span></span></label>` : "";
    return `${back()}${stepsHTML(4)}
      <div class="verdict ${v.kind}" id="verdict" data-kind="${v.kind}"><span class="vk">${esc(t("v.k", { n: nf(total()) }))}</span><h2>${head}</h2><p>${body}</p>${v.kind === "unfair" ? "" : bars}
        ${v.kind === "unfair" ? "" : `<p class="tiny muted">${esc(t("v.details", { d: pts(z.diff), lo: pts(z.ci[0]), hi: pts(z.ci[1]), srm: nf(v.srm, 2) }))}</p>`}</div>
      ${card}
      <button type="button" class="btn ghost full" data-act="go" data-view="duel" data-reset="1">${esc(t("v.again"))}</button>`;
  }

  /* ---------- Which would you read? ---------- */
  function viewPlay() {
    const p = state.play;
    const counts = `<div class="count"><div><b class="num" id="voted">${nf(p.voted)}</b><span>${esc(t("play.voted"))}</span></div><div><b class="num">${nf(p.voted)}</b><span>${esc(t("play.earned"))}</span></div></div>`;
    if (p.i >= POOL.length) {
      return `${back()}<h1>${esc(t("play.h"))}</h1>${counts}<p class="note">${esc(t("play.done", { n: nf(p.voted) }))}</p><button type="button" class="btn full" data-act="pagain">${esc(t("play.again"))}</button>`;
    }
    const c = POOL[p.i];

  function parseCSV(text) {
    const rows = [];
    let row = [], cell = "", q = false;
    const delim = (text.split(/\r?\n/)[0].match(/;/g) || []).length > (text.split(/\r?\n/)[0].match(/,/g) || []).length ? ";" : ",";
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (ch === '"') q = false; else cell += ch;
      } else if (ch === '"') q = true;
      else if (ch === delim) { row.push(cell); cell = ""; }
      else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
      else cell += ch;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows.filter((r) => r.some((c) => c.trim() !== ""));

  function money(s) {
    let x = String(s).replace(/[^\d.,-]/g, "");
    if (x.includes(",") && x.includes(".")) x = x.lastIndexOf(",") > x.lastIndexOf(".") ? x.replace(/\./g, "").replace(",", ".") : x.replace(/,/g, "");
    else if (x.includes(",")) x = /,\d{1,2}$/.test(x) ? x.replace(",", ".") : x.replace(/,/g, "");
    const n = parseFloat(x);
    return Number.isFinite(n) ? n : 0;
  }
  function analyze(text, royalty, days) {
    const rows = parseCSV(text);
    const hi = rows.findIndex((r) => r.some((c) => /click|clic/i.test(c)));
    if (hi < 0) return { error: true };
    const head = rows[hi].map((c) => c.trim().toLowerCase());
    const find = (...keys) => head.findIndex((h) => keys.some((k) => h.includes(k)));
    const iTerm = find("customer search term", "término de búsqueda", "termino de busqueda", "search term", "targeting", "segmentación");
    const iClicks = find("clicks", "clics");
    const iSpend = find("spend", "gasto", "inversión", "inversion");
    const iOrders = find("total orders", "pedidos totales", "orders", "pedidos");
    if ([iTerm, iClicks, iSpend, iOrders].some((i) => i < 0)) return { error: true };
    const byTerm = new Map();
    for (const r of rows.slice(hi + 1)) {
      const term = (r[iTerm] || "").trim();
      if (!term) continue;
      const k = byTerm.get(term) || { term, clicks: 0, spend: 0, orders: 0 };
      k.clicks += money(r[iClicks]); k.spend += money(r[iSpend]); k.orders += money(r[iOrders]);
      byTerm.set(term, k);
    }
    const kws = [...byTerm.values()].filter((k) => k.clicks > 0);
    const C = kws.reduce((s, k) => s + k.clicks, 0), O = kws.reduce((s, k) => s + k.orders, 0), SP = kws.reduce((s, k) => s + k.spend, 0);
    const p0 = C ? Math.min(0.9, Math.max(0.005, O / C)) : 0.05;
    const K = 20, a0 = p0 * K, b0 = (1 - p0) * K;
    const cpc0 = C ? SP / C : 0.4;
    const SURE = 0.9;
    for (const k of kws) {
      const cpc = k.clicks ? k.spend / k.clicks : cpc0;
      const be = Math.min(0.99, cpc / Math.max(0.01, royalty));
      const a = a0 + k.orders, b = b0 + k.clicks - k.orders;
      const below = betaCDF(be, a, b);
      k.be = be;
      k.every = Math.max(1, Math.round(1 / be));
      if (k.clicks >= 10 && below >= SURE) k.verdict = "stop";
      else if (k.clicks >= 10 && 1 - below >= SURE) k.verdict = "keep";
      else if (k.orders > 0 && k.clicks < 15 && k.orders / k.clicks > be) k.verdict = "luck";
      else {
        k.verdict = "wait";
        const mean = a / (a + b);
        k.more = null;
        for (let extra = 5; extra <= 300; extra += 5) {
          const pb = betaCDF(be, a + mean * extra, b + (1 - mean) * extra);
          if (pb >= SURE || 1 - pb >= SURE) { k.more = extra; break; }
        }
      }
    }
    const order = { stop: 0, luck: 1, wait: 2, keep: 3 };
    kws.sort((x, y) => order[x.verdict] - order[y.verdict] || y.spend - x.spend);
    const stops = kws.filter((k) => k.verdict === "stop");
    const counts = { stop: 0, keep: 0, luck: 0, wait: 0 };
    kws.forEach((k) => counts[k.verdict]++);
    return { kws, counts, save: (stops.reduce((s, k) => s + k.spend, 0) * 30) / Math.max(1, days), nStop: stops.length, p0 };
  }

  /* ---------- Real or luck? ---------- */
  function luckResult(l = state.luck) {
    const x1 = Math.round(l.bs), x2 = Math.round(l.as), d1 = l.bd, d2 = l.ad;
    if (!(x1 >= 0 && x2 >= 0 && d1 > 0 && d2 > 0) || x1 + x2 === 0) return { kind: "zero" };
    const p = d1 / (d1 + d2);
    const r1 = x1 / d1, r2 = x2 / d2;
    if (Math.abs(r1 - r2) < 1e-12) return { kind: "same" };
    const pv = binomP(x1, x1 + x2, p);
    if (pv < 0.05) return { kind: "real", pv, dir: r2 > r1 ? "up" : "down" };
    let f = null;
    for (let m = 2; m <= 26; m++) {
      const y1 = Math.round(x1 * m), y2 = Math.round(x2 * m);
      if (binomP(y1, y1 + y2, p) < 0.05) { f = m; break; }
    }
    return { kind: "unsure", pv, more: f ? Math.round(Math.max(d1, d2) * f) : null };
  }
