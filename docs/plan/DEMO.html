      d.votes[r.arm].n++;
      if (r.voted === "yes") d.votes[r.arm].yes++;
      d.readers.push({ n: r.n, arm: r.arm });
      render();
    }
    else if (act === "next") { newReader(); render(); }
    else if (act === "add") { addReaders(50); render(); }
    else if (act === "fill") { addReaders(Math.max(0, TARGET - total())); render(); }
    else if (act === "reveal") { d.step = "reveal"; render(); }
    else if (act === "copy") {
      const text = b.dataset.text;
      const done = () => { d.copied = state.view === "duel" && d.step === "reveal" ? "card" : "link"; render(); };
      try { navigator.clipboard.writeText(text).then(done, done); } catch (err) { done(); }
    }
    else if (act === "pvote") { state.play.voted++; state.play.i++; render(); }
    else if (act === "pagain") { state.play = { i: 0, voted: state.play.voted, arms: [] }; render(); }
    else if (act === "filter") { state.doc.filter = b.dataset.f; render(); }
    else if (act === "sample") { state.doc.csv = null; state.doc.file = ""; runDoctor(); render(); }
    else if (NERD_ACTS.includes(act) && state.view === "nerds") nerdAct(act, b);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !menu.hidden) { setMenu(false); menuBtn.focus(); }
    // The map's boxes are SVG groups: Enter and Space press them like buttons.
    else if ((e.key === "Enter" || e.key === " ") && e.target instanceof SVGElement && e.target.matches("[data-act]")) {
      e.preventDefault();
      e.target.dispatchEvent(new MouseEvent("click", { bubbles: true }));
    }
  });
  document.addEventListener("change", (e) => {
    const el = e.target, d = state.duel;
    if (el.id === "genre") { d.genre = el.value; render(); }
    else if (el.id === "blang") d.blang = el.value;
    else if (el.id === "fp") d.fp = el.checked;
    else if (el.id === "toLib") d.toLib = el.checked;
    else if (el.id === "scenario") { d.scenario = el.value; }
    else if (el.id === "upA" || el.id === "upB") loadImage(el.files && el.files[0], el.id.slice(2));
    else if (el.id === "csv") loadCSV(el.files && el.files[0]);
  });
  document.addEventListener("input", (e) => {
    const el = e.target, d = state.duel;
    if (el.id === "txA" || el.id === "txB") { d.text[el.id.slice(2)] = el.value; }
    else if (el.id === "notify") d.notify = el.value;
    else if (el.id === "royalty" || el.id === "days") {
      const n = money(el.value);
      if (n > 0) { state.doc[el.id] = n; runDoctor(); const pos = el.selectionStart; render(); const again = $("#" + el.id); if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (err) { /* ignore */ } } }
    }
    else if (["bs", "bd", "as", "ad"].includes(el.id)) {
      const n = money(el.value);
      if (n >= 0) { state.luck[el.id] = n; const pos = el.selectionStart; render(); const again = $("#" + el.id); if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (err) { /* ignore */ } } }
    }
  });
  // Shrink an uploaded cover in the browser, the way the real tool would before sending it.
  function loadImage(file, arm) {
    if (!file) return;
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const w = 400, h = 600, c = document.createElement("canvas");
        c.width = w; c.height = h;
        const g = c.getContext("2d");
        const scale = Math.max(w / img.width, h / img.height);
        g.drawImage(img, (w - img.width * scale) / 2, (h - img.height * scale) / 2, img.width * scale, img.height * scale);
        let url = c.toDataURL("image/webp", 0.8);
        if (!url.startsWith("data:image/webp")) url = c.toDataURL("image/jpeg", 0.8);
        const kb = Math.round(((url.length - url.indexOf(",") - 1) * 3) / 4 / 1024);
        state.duel.up[arm] = { url, kb };
        render();
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  }
  function loadCSV(file) {
    if (!file) return;
    const fr = new FileReader();
    fr.onload = () => { state.doc.csv = String(fr.result); state.doc.file = file.name; state.doc.filter = "all"; runDoctor(); render(); };
    fr.readAsText(file);
  }
  document.addEventListener("dragover", (e) => { const z = e.target.closest && e.target.closest("#drop"); if (z) { e.preventDefault(); z.classList.add("over"); } });
  document.addEventListener("dragleave", (e) => { const z = e.target.closest && e.target.closest("#drop"); if (z) z.classList.remove("over"); });
  document.addEventListener("drop", (e) => { const z = e.target.closest && e.target.closest("#drop"); if (z) { e.preventDefault(); z.classList.remove("over"); loadCSV(e.dataTransfer.files[0]); } });

  const wide = window.matchMedia("(min-width: 1080px)");
  const syncWhy = () => { $("#why").open = wide.matches; };
  try {
    wide.addEventListener("change", syncWhy); wideArt.addEventListener("change", render);
    ndWide.addEventListener("change", () => { if (state.view === "nerds") render(); });
  } catch (e) { /* old browsers */ }
  syncWhy();
  applyTheme();

  // Hooks for the click-through test (tools/check_demo.cjs).
  window.__ls = { state, verdict: duelVerdict, target: TARGET, analyze: () => state.doc.result, luck: luckResult, seed: SEED, paintings: () => [...PAINT.keys()], nerds: N };

  const start = (location.hash || "").replace("#", "");
  state.view = ["duel", "play", "doctor", "luck", "nerds"].includes(start) ? start : "home";
  render();
})();
</script>
</body>
